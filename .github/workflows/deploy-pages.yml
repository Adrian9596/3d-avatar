name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate glTF before publishing
        run: npm run validate:gltf -- assets/export/avatar_master.glb qa/avatar_master/gltf-validator-report.json

      # Builds both lanes: the prototype becomes the landing page and the
      # production viewer sits under /viewer/. Both are bundled, so no .mjs is
      # served -- static hosts do not agree on its MIME type and a browser will
      # not run a module served as anything but JavaScript.
      - name: Build both viewer lanes
        run: npm run build:pages

      - name: Refuse to publish a site that serves .mjs
        run: |
          set -euo pipefail
          if find dist -name '*.mjs' -print -quit | grep -q .; then
            echo "::error::dist contains .mjs files - a host that mislabels their MIME type would leave a blank page. They must be bundled."
            find dist -name '*.mjs'
            exit 1
          fi
          test -f dist/index.html || { echo "::error::dist/index.html missing - the prototype is the landing page"; exit 1; }
          test -f dist/assets/export/avatar_master.glb || { echo "::error::the prototype's GLB was not copied into dist"; exit 1; }
          test -f dist/viewer/index.html || { echo "::error::the production viewer is missing from dist/viewer"; exit 1; }
          echo "Layout OK: / = prototype, /viewer/ = production viewer, no .mjs served."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
