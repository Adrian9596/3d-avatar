name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate glTF before publishing
        run: npm run validate:gltf -- assets/export/avatar_master.glb qa/avatar_master/gltf-validator-report.json

      - name: Build production viewer
        run: npm run build:viewer

      - name: Assemble prototype (authoring) lane
        run: |
          set -euo pipefail
          PROTO=dist/prototype
          mkdir -p "$PROTO/assets/export" "$PROTO/contracts" "$PROTO/node_modules/three"
          cp digital_bra_fit_model_360.html "$PROTO/"
          cp -r scripts "$PROTO/scripts"
          cp assets/export/avatar_master.glb assets/export/avatar_master_reference_render.png "$PROTO/assets/export/"
          cp contracts/measurement-registry.json "$PROTO/contracts/"
          # Vendored whole (not cherry-picked): Line2/GLTFLoader etc. pull in
          # transitive files (LineSegments2.js, BufferGeometryUtils.js, ...)
          # not directly imported by the HTML's own import map.
          cp -r node_modules/three/build "$PROTO/node_modules/three/build"
          cp -r node_modules/three/examples "$PROTO/node_modules/three/examples"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
